<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Explorer</title>
    <!-- <link rel="stylesheet" href="./css/styles.css" /> -->
  </head>
  <body>
    <div class="container">
      <form class="search-form">
        <div class="form-wrap">
          <label class="label">
            <input
              class="input"
              type="text"
              name="searchQuery"
              autocomplete="off"
              placeholder="Search images..."
              autofocus
            />
          </label>
        </div>
        <button class="btn disabled" type="submit">Search</button>
      </form>
      <div class="search-history">
        <p>Recent searches:</p>
        <ul class="history-list"></ul>
      </div>
      <ul class="gallery"></ul>
      <div class="buttons">
        <button class="load-more unvisible" type="button">Load more</button>
        <button class="back-to-top unvisible" type="button">Back to top</button>
      </div>
      <div class="loader unvisible"></div>
    </div>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
